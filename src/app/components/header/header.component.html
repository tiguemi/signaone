<header class="header">
  <div class="container">
    <div class="header-content">
      <a class="logo" (click)="goHome()" style="cursor:pointer">
        <img src="Logo_elegant_de_Signa_One.png" alt="Signa One">
      </a>

      <nav class="nav" [class.active]="isMenuOpen">
        <a class="nav-link" [class.active]="isHome && activeSection === 'accueil'" (click)="navigateToSection('accueil')">Accueil</a>
        <a class="nav-link" [class.active]="isHome && activeSection === 'enseigne'" (click)="navigateToSection('enseigne')">Enseigne</a>
        <a class="nav-link" [class.active]="isHome && activeSection === 'signaletique'" (click)="navigateToSection('signaletique')">Signalétique</a>
        <a class="nav-link" [class.active]="isHome && activeSection === 'realisations'" (click)="navigateToSection('realisations')">Réalisations</a>
        <a class="nav-link" [class.active]="isHome && activeSection === 'devis'" (click)="navigateToSection('devis')">Devis</a>
        <a class="nav-link" [class.active]="isHome && activeSection === 'contact'" (click)="navigateToSection('contact')">Contact</a>
      </nav>

      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
